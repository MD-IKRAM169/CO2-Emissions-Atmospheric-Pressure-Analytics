name: Python ETL tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test using fictional sample inputs
        run: |
          python -m portfolio.pipeline \
            --co2 examples/synthetic_co2.csv \
            --pressure examples/synthetic_pressure.csv \
            --database outputs/demo.sqlite \
            --summary outputs/summary.json
